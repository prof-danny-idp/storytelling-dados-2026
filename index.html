<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trabalhos Finais 2026 — Storytelling de Dados</title>
<style>
  :root {
    --bg: #f7f7f8;
    --card-bg: #ffffff;
    --border: #e2e2e6;
    --text: #1c1c1f;
    --text-muted: #6b6b73;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --pending-bg: #fef3f2;
    --pending-border: #fecdca;
    --pending-text: #b42318;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 2.5rem 1.5rem 4rem;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  header { margin-bottom: 2.5rem; }
  h1 { font-size: 1.75rem; margin: 0 0 0.4rem; letter-spacing: -0.02em; }
  .subtitle { color: var(--text-muted); font-size: 0.95rem; margin: 0; }
  ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.6rem; }
  li.card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.95rem 1.15rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  .name { font-weight: 600; font-size: 0.98rem; }
  .type { color: var(--text-muted); font-size: 0.8rem; margin-top: 0.15rem; }
  .name-row { display: flex; align-items: center; gap: 0.7rem; }
  .bat-badge {
    flex: none;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    background: #17171a;
    border: 1.5px solid #d4af37;
    box-shadow: 0 0 0 1px rgba(212,175,55,0.25);
  }
  a.link-btn {
    text-decoration: none;
    color: #fff;
    background: var(--accent);
    padding: 0.45rem 0.9rem;
    border-radius: 7px;
    font-size: 0.85rem;
    font-weight: 500;
    white-space: nowrap;
  }
  a.link-btn:hover { background: var(--accent-hover); }
  .pending {
    background: var(--pending-bg);
    border-color: var(--pending-border);
  }
  .pending-tag {
    color: var(--pending-text);
    font-size: 0.8rem;
    font-weight: 600;
    background: #fff;
    border: 1px solid var(--pending-border);
    padding: 0.35rem 0.7rem;
    border-radius: 7px;
    white-space: nowrap;
  }
  footer { margin-top: 3rem; color: var(--text-muted); font-size: 0.8rem; text-align: center; }

  a.back { display:inline-block; margin-bottom:1.2rem; color:var(--accent); text-decoration:none; font-size:0.88rem; }
  a.back:hover { text-decoration:underline; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:1rem; }
  a.turma { display:block; background:var(--card-bg); border:1px solid var(--border); border-radius:12px; padding:1.6rem 1.4rem; text-decoration:none; color:var(--text); transition:border-color .15s, transform .15s; }
  a.turma:hover { border-color:var(--accent); transform:translateY(-2px); }
  .turma h2 { margin:0 0 .35rem; font-size:1.25rem; }
  .turma p { margin:0; color:var(--text-muted); font-size:.9rem; }
  .turma .go { margin-top:1rem; color:var(--accent); font-weight:600; font-size:.88rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Trabalhos Finais 2026 — Storytelling de Dados</h1>
    <p class="subtitle">PCDIA · Mestrado em Administração Pública · IDP</p>
  </header>

  <div class="grid">
    <a class="turma" href="julho-2026/">
      <h2>Turma Julho/2026</h2>
      <p>27 trabalhos finais</p>
      <div class="go">Ver trabalhos →</div>
    </a>
    <a class="turma" href="outubro-2026/">
      <h2>Turma Outubro/2026</h2>
      <p>21 trabalhos finais</p>
      <div class="go">Ver trabalhos →</div>
    </a>
  </div>

  <footer>Storytelling de Dados · 2026</footer>
</div>
</body>
</html>
